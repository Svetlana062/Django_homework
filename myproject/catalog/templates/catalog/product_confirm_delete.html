{% extends 'catalog/base.html' %}

{% block content %}
<h2>Удаление продукта "{{ object.name }}"</h2>
<form method="post">
  {% csrf_token %}
  <p>Вы уверены, что хотите удалить этот продукт?</p>
  <button type="submit" class="btn btn-danger">Удалить</button>
  <a href="{% url 'home' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
